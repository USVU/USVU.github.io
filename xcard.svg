  <!-- Corner brackets -->
  <path d="M60 40 L60 60" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M60 40 L80 40" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M1140 40 L1140 60" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M1120 40 L1140 40" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M60 590 L60 570" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M60 590 L80 590" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M1140 590 L1140 570" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M1120 590 L1140 590" stroke="#20ff20" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="220" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="64" font-weight="bold" fill="#20ff20">USVirtualUni</text>

  <!-- Subtitle -->
  <text x="600" y="295" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="32" fill="#20ff20" fill-opacity="0.9">AAPL 19.91 — &quot;D Otomei&quot;</text>

  <!-- Tagline -->
  <text x="600" y="345" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="20" fill="#20ff20" fill-opacity="0.6">Artist / MetaDeveloper / B.I.G.</text>

  <!-- Separator -->
  <line x1="400" y1="400" x2="800" y2="400" stroke="#20ff20" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Credits -->
  <text x="600" y="447" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="16" fill="#20ff20" fill-opacity="0.5">BLACK DIGITAL CyberSecure #BDCS</text>
  <text x="600" y="475" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="16" fill="#20ff20" fill-opacity="0.5">Incubator Studios Outbeat Produce EST 2024</text>

  <!-- Prompt indicator -->
  <text x="60" y="560" font-family="'Courier New', Courier, monospace" font-size="12" fill="#20ff20" fill-opacity="0.25">root@usvu:~$ og_card --render 1200x630</text>

  <!-- Blinking cursor -->
  <rect x="435" y="546" width="8" height="14" fill="#20ff20" fill-opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="1.5s" repeatCount="indefinite"/>
  </rect>
