  <!-- Scan line effect overlay -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20ff20" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#20ff20" stop-opacity="0"/>
      <stop offset="100%" stop-color="#20ff20" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top border accent -->
